site_name: Sportify — Scoring & Matchmaking
site_description: Documentación del sistema de scoring y matchmaking
docs_dir: docs

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: teal

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Datos:
      - datos/index.md
      - El dato que recibimos: datos/el-dato.md
      - Limpieza (silver):
          - datos/limpieza/index.md
          - Suavizado: datos/limpieza/suavizado.md
          - Interpolación: datos/limpieza/interpolacion.md
          - Continuidad de IDs: datos/limpieza/continuidad-ids.md
          - Derivación de velocidades: datos/limpieza/velocidades.md
          - Asignación de equipo: datos/limpieza/asignacion-equipo.md
          - Validación de calidad: datos/limpieza/validacion-calidad.md
  - Analytics:
      - analytics/index.md
      - Métricas espaciales:
          - analytics/metricas/index.md
          - Centroide: analytics/metricas/centroide.md
          - Stretch index: analytics/metricas/stretch-index.md
          - Convex hull y EPS: analytics/metricas/convex-hull-y-eps.md
          - Length y width: analytics/metricas/length-width.md
      - Superficies de valor:
          - analytics/valor/index.md
          - Pitch control: analytics/valor/pitch-control.md
          - OBSO: analytics/valor/obso.md
          - EPV: analytics/valor/epv.md
          - Wide Open Spaces: analytics/valor/wide-open-spaces.md
          - xT y VAEP: analytics/valor/xt-vaep.md
      - Dominancia:
          - analytics/dominancia/index.md
          - Score de dominancia: analytics/dominancia/score-dominancia.md
      - Eventos (diferido):
          - analytics/eventos/index.md
          - SPADL: analytics/eventos/spadl.md
          - PPDA y line-breaking: analytics/eventos/ppda-y-line-breaking.md
  - Matchmaking:
      - matchmaking/index.md
      - Rating:
          - matchmaking/rating/index.md
          - OpenSkill: matchmaking/rating/openskill.md
          - Margen: matchmaking/rating/margen.md
          - Glicko-2: matchmaking/rating/glicko2.md
      - El puente: matchmaking/el-puente.md
      - Reparto a jugadores: matchmaking/reparto.md
      - Emparejamiento: matchmaking/emparejamiento.md
      - Cold-start: matchmaking/cold-start.md
  - Plataforma:
      - plataforma/index.md
      - Backend (Go): plataforma/backend.md
      - Workers (Python): plataforma/workers.md
      - Base de datos (MongoDB): plataforma/base-de-datos.md
      - Identidad: plataforma/identidad.md
      - Monolito modular: plataforma/monolito-modular.md
  - Decisiones (ADR): decisions/log.md
  - Research:
      - research/README.md
      - Bibliografía: research/references.md
  - Glosario: glosario.md
  - Roadmap: roadmap.md
