[project]
name = "sportify-scoring-workers"
version = "0.0.1"
description = "Workers de analytics (medallón) + rating para Sportify scoring/matchmaking"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kloppy",      # modelo de tracking + parsers (Metrica, etc.)
    "mplsoccer",   # dibujar la cancha
    "numpy",
    "pandas",
    "scipy",       # suavizado, geometría (convex hull, etc.)
    "matplotlib",
]

[project.optional-dependencies]
dev = ["jupyterlab", "pytest", "ruff"]
# Se suman más adelante, por etapa del roadmap:
#   socceraction  -> SPADL / VAEP / xT   (rama B: eventos y valor)
#   openskill     -> rating Plackett-Luce (rama A)
#   pyarrow       -> persistencia parquet (bronze/silver)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sportify_scoring"]

[tool.ruff]
line-length = 100
